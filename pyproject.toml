[project]
name = "photocollage"
description = "Headless command line tool to make photo collage posters"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.9"
license = {text = "GPL-2.0-or-later"}
authors = [{name = "Adrien Vergé"}]
keywords = ["photocollage", "photo", "collage", "poster", "mosaic", "image", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "flake8",
    "flake8-import-order",
]
toml = [
    "tomli; python_version < '3.11'",
]

[project.scripts]
photocollage = "photocollage.cli:main"

[project.urls]
homepage = "https://github.com/adrienverge/PhotoCollage"
repository = "https://github.com/adrienverge/PhotoCollage"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 61"]

[tool.setuptools]
packages = ["photocollage"]

[tool.setuptools.dynamic]
version = {attr = "photocollage.__version__"}
